---
# tasks file for docker
- name: "Get os version"
  command: lsb_release -cs
  register: os_version
  changed_when: false
# Docker
- name: "Add Docker Apt signing key, uses whichever key is at the URL"
  become: yes
  apt_key:
    url: "{{ docker.gpg_uri }}"
    state: present
- name: "Add Docker repository"
  become: yes
  apt_repository:
    repo: "deb [arch=amd64] {{ docker.uri }} {{ os_version.stdout }} stable"
    state: present
  register: dock_repo_updated
- name: "Refresh apt cache"
  become: yes
  apt:
    update_cache: yes
  when: dock_repo_updated.changed == true
- name: "Install Docker"
  become: yes
  apt:
    name: "{{ docker.packages | join(',') }}"
    state: present
